<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Intake Form — SponsorAPurpose</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;}
body{background:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
*{box-sizing:border-box;}
input,textarea,select{font-family:Montserrat,sans-serif;}
input:focus,textarea:focus{outline:none;border-color:#94A3B8!important;box-shadow:0 0 0 3px #CBD5E1!important;}
button{font-family:Montserrat,sans-serif;}
button:hover{opacity:.9;}
.btn-back:hover{background:#F1F5F9!important;border-color:#94A3B8!important;}
.btn-next:hover,.btn-submit:hover{background:#01486F!important;}
</style>
</head>
<body>
<!-- Netlify Forms detection form (hidden — must be present in HTML at build time) -->
<form name="nonprofit-intake" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field" />
  <input type="text" name="client_id" />
  <input type="text" name="org_name" />
  <input type="text" name="contact_name" />
  <input type="text" name="contact_role" />
  <input type="email" name="contact_email" />
  <input type="tel" name="contact_phone" />
  <input type="url" name="website_url" />
  <input type="text" name="what_you_do" />
  <input type="text" name="what_unique" />
  <input type="text" name="describe" />
  <input type="text" name="build_reasons" />
  <input type="text" name="priority_actions" />
  <input type="text" name="audience_primary" />
  <input type="text" name="audience_secondary" />
  <input type="text" name="audience_info" />
  <input type="text" name="assets" />
  <input type="text" name="photo_availability" />
  <input type="text" name="photo_count" />
  <input type="text" name="copy_handling" />
  <input type="text" name="social_facebook" />
  <input type="text" name="social_instagram" />
  <input type="text" name="social_linkedin" />
  <input type="text" name="social_youtube" />
  <input type="text" name="social_tiktok" />
  <input type="text" name="social_twitter" />
  <input type="text" name="pages" />
  <input type="text" name="modules" />
  <input type="text" name="features_forms" />
  <input type="text" name="features_donations" />
  <input type="text" name="features_access" />
  <input type="text" name="features_misc" />
  <input type="text" name="who_updates" />
  <input type="text" name="edit_scope" />
  <input type="text" name="update_freq" />
  <input type="text" name="tech_stack" />
  <input type="text" name="admin_access" />
  <input type="text" name="feel_different" />
  <input type="text" name="not_like" />
  <input type="text" name="like_sites" />
  <input type="text" name="like_what" />
  <input type="text" name="brand_colors" />
  <input type="text" name="fonts" />
  <input type="text" name="launch_date" />
  <input type="text" name="launch_driver" />
  <input type="text" name="approver_name" />
  <input type="email" name="approver_email" />
  <input type="text" name="comms_people" />
  <input type="text" name="anything_else" />
</form>

<div id="app" style="min-height:100vh;background:#fff;font-family:Montserrat,ui-sans-serif,system-ui,sans-serif;color:#020617;padding:48px 24px 96px;">
<div style="max-width:680px;margin:0 auto;" id="root"></div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  step: 1, submitted: false, data: {}, ranked: [], drag: null, tried: {}
};

function setState(patch) {
  if (typeof patch === 'function') { const r = patch(state); if (!r) return; Object.assign(state, r); }
  else Object.assign(state, patch);
  render();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function get(key, def) { const v = state.data[key]; return v === undefined ? (def === undefined ? '' : def) : v; }
function set(key, val) { setState(s => ({ data: { ...s.data, [key]: val } })); }
function txt(key) { return (e) => { state.data[key] = e.target.value; }; }
function arr(key) { const a = state.data[key]; return Array.isArray(a) ? a : []; }
function toggle(key, val, cap) {
  setState(s => {
    const a = Array.isArray(s.data[key]) ? s.data[key].slice() : [];
    const i = a.indexOf(val);
    if (i >= 0) a.splice(i, 1);
    else { if (cap && a.length >= cap) return null; a.push(val); }
    return { data: { ...s.data, [key]: a } };
  });
}
function toggleBool(key) { setState(s => ({ data: { ...s.data, [key]: !s.data[key] } })); }

// ─── Validators ──────────────────────────────────────────────────────────────
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const isUrl = v => /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/[^\s]*)?$/i.test(v);

function validateStep(step) {
  const d = state.data;
  const errs = {};
  const req = k => { if (!String(get(k)).trim()) errs[k] = 'req'; };
  const email = (k, required) => { const v = String(get(k)).trim(); if (!v) { if (required) errs[k] = 'req'; return; } if (!isEmail(v)) errs[k] = 'email'; };
  const url = (k, required) => { const v = String(get(k)).trim(); if (!v) { if (required) errs[k] = 'req'; return; } if (!isUrl(v)) errs[k] = 'url'; };

  if (step === 1) { req('orgName'); req('contactName'); req('contactRole'); email('contactEmail', true); if (!d.noWebsite) url('websiteUrl', false); req('whatYouDo'); }
  if (step === 2) { if (arr('buildReasons').length === 0) errs.buildReasons = 'req'; if (state.ranked.length === 0) errs.ranking = 'req'; }
  if (step === 3) { req('audiencePrimary'); }
  if (step === 4) {
    ['asset_logo','asset_brand','asset_videos','asset_copy','asset_testimonials'].forEach(k => { if (!get(k)) errs.assets = 'req'; });
    if (!get('photoAvail')) errs.photoAvail = 'req';
    if (!get('copyHandling')) errs.copyHandling = 'req';
    ['facebook','instagram','linkedin','youtube','tiktok','twitter','socialOther'].forEach(k => url(k, false));
  }
  if (step === 5) { if (arr('pages').length === 0) errs.pages = 'req'; }
  if (step === 6) { const any = ['featForms','featDonations','featAccess','featMisc'].some(g => arr(g).length > 0); if (!any) errs.features = 'req'; }
  if (step === 7) { if (!get('whoUpdates')) errs.whoUpdates = 'req'; }
  if (step === 8) {
    TECH_BASES.forEach(base => { const use = get(base + '_use'); if (!use) errs.tech = 'req'; else if (use === 'Yes' && !String(get(base + '_plat')).trim()) errs.tech = 'req'; });
    email('accessProviderEmail', false);
  }
  if (step === 9) {
    const sites = ['likeSite1','likeSite2','likeSite3','likeSite4','likeSite5'];
    if (!sites.some(k => String(get(k)).trim())) errs.likeSites = 'req';
    sites.forEach(k => url(k, false));
    if (!get('brandColors')) errs.brandColors = 'req';
    if (!get('fonts')) errs.fonts = 'req';
  }
  if (step === 10) { if (!d.noLaunchDate) req('launchDate'); if (!d.approvalSame) { req('approverName'); email('approverEmail', true); } }
  return errs;
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
function goStep(s) { setState({ step: s }); window.scrollTo(0,0); }
function back() { goStep(Math.max(1, state.step - 1)); }
function next() {
  const errs = validateStep(state.step);
  setState(s => ({ tried: { ...s.tried, [s.step]: true } }));
  if (Object.keys(errs).length > 0) { window.scrollTo(0,0); return; }
  goStep(state.step + 1);
}
// ─── Netlify Forms submission ─────────────────────────────────────────────────
function getClientId() {
  // Captures slug from URL: /client/rainbow-community → "rainbow-community"
  const match = window.location.pathname.match(/\/client\/([^/]+)/);
  return match ? match[1] : (new URLSearchParams(window.location.search).get('client') || 'direct');
}

function buildFormPayload() {
  const d = state.data;
  const g = (k, def) => { const v = d[k]; return v === undefined ? (def || '') : v; };
  const a = (k) => Array.isArray(d[k]) ? d[k].join(', ') : '';

  // Tech stack summary
  const techSummary = TECH_BASES.map((base, i) => {
    const use = g(base + '_use'); if (!use || use === 'No') return null;
    const plat = g(base + '_plat');
    return `${TECH_LABELS[i]}: ${use}${plat ? ' (' + plat + ')' : ''}`;
  }).filter(Boolean).join(' | ');

  // Assets summary
  const assetSummary = [['Logo files','asset_logo'],['Brand guidelines','asset_brand'],['Videos','asset_videos'],['Written copy','asset_copy'],['Testimonials','asset_testimonials']]
    .map(([lbl, k]) => `${lbl}: ${g(k) || '—'}`).join(' | ');

  return {
    'form-name': 'nonprofit-intake',
    'bot-field': '',
    client_id: getClientId(),
    org_name: g('orgName'),
    contact_name: g('contactName'),
    contact_role: g('contactRole'),
    contact_email: g('contactEmail'),
    contact_phone: g('contactPhone'),
    website_url: d.noWebsite ? 'No website' : g('websiteUrl'),
    what_you_do: g('whatYouDo'),
    what_unique: g('whatUnique'),
    describe: a('describe') + (g('describeOther') ? ' — ' + g('describeOther') : ''),
    build_reasons: a('buildReasons') + (g('buildReasonsOther') ? ' — ' + g('buildReasonsOther') : ''),
    priority_actions: state.ranked.join(' > ') + (g('rankOther') ? ' (' + g('rankOther') + ')' : ''),
    audience_primary: g('audiencePrimary'),
    audience_secondary: g('audienceSecondary'),
    audience_info: g('audienceInfo'),
    assets: assetSummary,
    photo_availability: g('photoAvail') + (g('photoCount') ? ' — ' + g('photoCount') : ''),
    copy_handling: g('copyHandling'),
    social_facebook: g('facebook'),
    social_instagram: g('instagram'),
    social_linkedin: g('linkedin'),
    social_youtube: g('youtube'),
    social_tiktok: g('tiktok'),
    social_twitter: g('twitter'),
    pages: a('pages') + (g('pagesOther') ? ' — ' + g('pagesOther') : ''),
    modules: a('modules') + (g('modulesOther') ? ' — ' + g('modulesOther') : ''),
    features_forms: a('featForms') + (g('featFormsOther') ? ' — ' + g('featFormsOther') : ''),
    features_donations: a('featDonations'),
    features_access: a('featAccess') + (g('featAccessOther') ? ' — ' + g('featAccessOther') : ''),
    features_misc: a('featMisc') + (g('featMiscOther') ? ' — ' + g('featMiscOther') : ''),
    who_updates: g('whoUpdates'),
    edit_scope: g('editScope') + (g('editItems') ? ' — ' + g('editItems') : ''),
    update_freq: g('updateFreq'),
    tech_stack: techSummary,
    admin_access: g('adminAccess'),
    feel_different: g('feelDifferent'),
    not_like: g('notLike'),
    like_sites: ['likeSite1','likeSite2','likeSite3','likeSite4','likeSite5'].map(k => g(k)).filter(Boolean).join(', '),
    like_what: g('likeWhat'),
    brand_colors: g('brandColors') + (g('brandColorsList') ? ' — ' + g('brandColorsList') : ''),
    fonts: g('fonts') + (g('fontsList') ? ' — ' + g('fontsList') : ''),
    launch_date: d.noLaunchDate ? 'No specific date' : g('launchDate'),
    launch_driver: g('launchDriver'),
    approver_name: d.approvalSame ? 'Same as contact' : g('approverName'),
    approver_email: d.approvalSame ? g('contactEmail') : g('approverEmail'),
    comms_people: g('commsPeople'),
    anything_else: g('anythingElse'),
  };
}

async function submit() {
  const errs = validateStep(11);
  setState(s => ({ tried: { ...s.tried, 11: true } }));
  if (Object.keys(errs).length > 0) { window.scrollTo(0,0); return; }

  setState({ submitting: true });

  try {
    const payload = buildFormPayload();
    const body = new URLSearchParams(payload).toString();
    await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
  } catch (e) {
    // If fetch fails (e.g. local testing), still show thank-you
    console.warn('Netlify submit error:', e);
  }

  setState({ submitted: true, submitting: false });
  window.scrollTo(0,0);
}

// ─── Ranking ─────────────────────────────────────────────────────────────────
function addRank(label) { setState(s => s.ranked.length >= 3 || s.ranked.includes(label) ? null : { ranked: [...s.ranked, label] }); }
function removeRank(label) { setState(s => ({ ranked: s.ranked.filter(x => x !== label) })); }
function moveRank(i, dir) {
  setState(s => {
    const r = s.ranked.slice(); const j = i + dir;
    if (j < 0 || j >= r.length) return null;
    [r[i],r[j]] = [r[j],r[i]]; return { ranked: r };
  });
}
function dropRank(i) {
  setState(s => {
    const from = s.drag; if (from === null || from === i) return { drag: null };
    const r = s.ranked.slice(); const [m] = r.splice(from, 1); r.splice(i, 0, m);
    return { ranked: r, drag: null };
  });
}

// ─── Style builders ──────────────────────────────────────────────────────────
const pill = h => `height:${h}px;padding:0 14px;border-radius:9999px;background:#fff;font-family:Montserrat,sans-serif;font-size:14px;letter-spacing:-0.5px;color:#020617;width:100%;outline:none;box-sizing:border-box;`;
const area = mh => `min-height:${mh}px;padding:10px 14px;border-radius:12px;background:#fff;font-family:Montserrat,sans-serif;font-size:14px;line-height:20px;letter-spacing:-0.3px;color:#020617;width:100%;resize:vertical;outline:none;box-sizing:border-box;`;
const bd = err => err ? 'border:1px solid #DC2626;box-shadow:0 0 0 3px #FECACA;' : 'border:1px solid #CBD5E1;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);';
const MSG = { req: 'This field is required.', email: 'Enter a valid email address.', url: 'Enter a valid URL.' };

function boxStyle(on, kind) {
  if (kind === 'radio-sm') return `width:18px;height:18px;border-radius:9999px;border:1px solid ${on?'#077CBF':'#94A3B8'};background:${on?'#077CBF':'#fff'};box-shadow:0 1px 2px 0 rgba(0,0,0,.05);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;`;
  if (kind === 'radio') return `width:20px;height:20px;border-radius:9999px;border:1px solid ${on?'#077CBF':'#94A3B8'};background:${on?'#077CBF':'#fff'};box-shadow:0 1px 2px 0 rgba(0,0,0,.05);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;`;
  return `width:18px;height:18px;border-radius:4px;border:1px solid ${on?'#077CBF':'#94A3B8'};background:${on?'#077CBF':'#fff'};box-shadow:0 1px 2px 0 rgba(0,0,0,.05);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;margin-top:1px;`;
}

const TECH_BASES = ['tech_hosting','tech_domain','tech_dns','tech_email','tech_crm','tech_donation','tech_sms','tech_cms','tech_event','tech_membership','tech_store','tech_payment','tech_other'];
const TECH_LABELS = ['Website hosting provider','Domain registrar','DNS management','Email marketing platform','CRM','Donation platform','SMS platform','CMS','Event management platform','Membership platform','Online store','Payment processor','Other'];
const RANK_OPTS = ['Donate','Volunteer','Register for events','Contact us','Join newsletter','Apply','Request services','Become a member','Browse resources','Other'];

// ─── DOM helpers ─────────────────────────────────────────────────────────────
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else if (k === 'draggable') el.draggable = v;
    else if (k === 'disabled') { if (v) el.disabled = true; }
    else if (k === 'type') el.type = v;
    else if (k === 'placeholder') el.placeholder = v;
    else if (k === 'value' && (tag === 'input' || tag === 'textarea')) { el.value = v; }
    else el.setAttribute(k, v);
  }
  children.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}
function div(style, ...children) { return h('div', {style}, ...children); }
function span(style, ...children) { return h('span', {style}, ...children); }
function label(style, ...children) { return h('label', {style}, ...children); }
function p(style, ...children) { return h('p', {style}, ...children); }

function fieldErr(msg) {
  return div('font-size:12px;color:#DC2626;margin-top:6px;letter-spacing:-0.1px;', msg);
}

// ─── Field builder ───────────────────────────────────────────────────────────
function buildFields(errs) {
  const VAR = {
    orgName: pill(38), contactName: pill(38), contactRole: pill(38), contactEmail: pill(38), contactPhone: pill(38), websiteUrl: pill(38),
    describeOther: pill(38), buildReasonsOther: pill(38), rankOther: pill(38), pagesOther: pill(38), modulesOther: pill(38), editItems: pill(38),
    accessProviderName: pill(38), accessProviderEmail: pill(38), approverName: pill(38), approverRole: pill(38), approverEmail: pill(38), approverPhone: pill(38),
    brandColorsList: pill(38), fontsList: pill(38),
    likeSite1: pill(38), likeSite2: pill(38), likeSite3: pill(38), likeSite4: pill(38), likeSite5: pill(38),
    launchDate: pill(38) + 'max-width:240px;',
    facebook: pill(36), instagram: pill(36), linkedin: pill(36), youtube: pill(36), tiktok: pill(36), twitter: pill(36), socialOther: pill(36),
    featFormsOther: pill(36), featAccessOther: pill(36), featMiscOther: pill(36),
    whatYouDo: area(96), whatUnique: area(96), audiencePrimary: area(88), audienceSecondary: area(88), audienceInfo: area(88),
    feelDifferent: area(80), notLike: area(80), likeWhat: area(80), launchDriver: area(72), commsPeople: area(72), anythingElse: area(120)
  };
  const f = {};
  Object.keys(VAR).forEach(k => {
    const e = errs[k];
    f[k] = { value: get(k, ''), set: txt(k), style: (VAR[k] || pill(38)) + bd(!!e), hasErr: !!e, errMsg: e ? MSG[e] : '' };
  });
  return f;
}

// ─── Check/radio groups ──────────────────────────────────────────────────────
function checkGroup(key, opts, cap) {
  const a = arr(key);
  return opts.map(o => {
    const checked = a.includes(o);
    const disabled = !!cap && !checked && a.length >= cap;
    return { label: o, checked, toggle: disabled ? ()=>{} : ()=>toggle(key, o, cap), boxStyle: boxStyle(checked, 'check') + (disabled ? 'opacity:.4;' : '') };
  });
}
function radioGroup(key, opts, kind) {
  const cur = get(key);
  return opts.map(o => ({ label: o, checked: cur === o, select: ()=>set(key, o), boxStyle: boxStyle(cur === o, kind || 'radio') }));
}

// ─── Section builders ────────────────────────────────────────────────────────
function checkRow(opt) {
  const el = label('display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;',
    span(opt.boxStyle, opt.checked ? h('i', {className:'ph ph-check', style:'font-size:12px;'}) : null),
    span('font-size:14px;letter-spacing:-0.3px;color:#020617;line-height:1.3;', opt.label)
  );
  el.addEventListener('click', opt.toggle);
  return el;
}

function radioRow(opt, inline) {
  const el = label(
    inline ? 'display:flex;align-items:center;gap:8px;cursor:pointer;' : 'display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;',
    span(opt.boxStyle, opt.checked ? span('width:8px;height:8px;border-radius:9999px;background:#fff;') : null),
    span('font-size:14px;letter-spacing:-0.3px;color:#020617;line-height:1.3;', opt.label)
  );
  el.addEventListener('click', opt.select);
  return el;
}

function fieldInput(fobj, type) {
  const tag = (type === 'textarea') ? 'textarea' : 'input';
  const el = h(tag, {type: type||'text', value: fobj.value, style: fobj.style, placeholder: ''});
  el.addEventListener('input', fobj.set);
  return el;
}

function labelEl(text, required) {
  const lbl = h('label', {style:'font-family:Montserrat;font-size:15px;font-weight:600;color:#020617;letter-spacing:-0.2px;margin-bottom:8px;display:block;'}, text);
  if (required) lbl.appendChild(span('color:#DC2626;margin-left:2px;', '*'));
  return lbl;
}

function subLabelEl(text) {
  return p('font-size:12px;color:#64748B;margin:0 0 12px;letter-spacing:-0.1px;', text);
}

function inputField(key, f, type, ph, required, labelText) {
  const wrapper = div('margin-bottom:24px;');
  wrapper.appendChild(labelEl(labelText, required));
  const tag = (type === 'textarea') ? 'textarea' : 'input';
  const el = h(tag, {style: f[key].style, placeholder: ph || '', type: type || 'text', value: f[key].value || ''});
  el.addEventListener('input', f[key].set);
  wrapper.appendChild(el);
  if (f[key].hasErr) wrapper.appendChild(fieldErr(f[key].errMsg));
  return wrapper;
}

// ─── Section 1 ───────────────────────────────────────────────────────────────
function renderS1(f, errs, tried) {
  const frag = document.createDocumentFragment();

  // org name
  frag.appendChild(inputField('orgName', f, 'text', "Your organization's name", true, 'Organization name'));

  // contact block
  const contactBox = div('margin-bottom:24px;padding:18px;border:1px solid #E2E8F0;border-radius:12px;background:#F8FAFC;');
  const ctitle = div('font-family:Montserrat;font-size:15px;font-weight:600;color:#020617;letter-spacing:-0.2px;margin-bottom:14px;', 'Main point of contact');
  ctitle.appendChild(span('color:#DC2626;margin-left:2px;', '*'));
  contactBox.appendChild(ctitle);
  const cgrid = div('display:grid;grid-template-columns:1fr 1fr;gap:14px;');
  [['contactName','text','Full name',true,'Name'],['contactRole','text','e.g. Executive director',true,'Role / title'],['contactEmail','email','name@org.org',true,'Email'],['contactPhone','tel','(555) 000-0000',false,'Phone']].forEach(([k,t,ph,req,lbl]) => {
    const w = div('');
    const lb = h('label', {style:'font-family:Montserrat;font-size:13px;font-weight:500;color:#1E293B;margin-bottom:6px;display:block;'}, lbl);
    if (!req) lb.appendChild(span('color:#94A3B8;font-weight:400;', ' (optional)'));
    w.appendChild(lb);
    const inp = h('input', {type:t, style:f[k].style, placeholder:ph, value:f[k].value});
    inp.addEventListener('input', f[k].set);
    w.appendChild(inp);
    if (f[k].hasErr) w.appendChild(fieldErr(f[k].errMsg));
    cgrid.appendChild(w);
  });
  contactBox.appendChild(cgrid);

  const fdw = div('margin-bottom:24px;');
  fdw.appendChild(labelEl('Should the website feel any different from how you described your organization?', false));
  fdw.appendChild(p('font-size:12px;color:#64748B;margin:0 0 8px;letter-spacing:-0.1px;', 'Optional. e.g. "We\'re a serious legal aid org, but we want the site to feel more hopeful and approachable than our day-to-day work might suggest."'));
  const fdt = h('textarea',{style:f.feelDifferent.style,placeholder:'How should it feel?'});
  fdt.value = f.feelDifferent.value; fdt.addEventListener('input', f.feelDifferent.set);
  fdw.appendChild(fdt); frag.appendChild(fdw);

  const nlw = div('margin-bottom:24px;');
  nlw.appendChild(labelEl('Is there anything you do NOT want the website to look like?', false));
  const nlt = h('textarea',{style:f.notLike.style,placeholder:'Styles, sites, or treatments to avoid.'});
  nlt.value = f.notLike.value; nlt.addEventListener('input', f.notLike.set);
  nlw.appendChild(nlt); frag.appendChild(nlw);

  const lsw = div('margin-bottom:24px;');
  lsw.appendChild(labelEl('Share 1–5 websites you like', true));
  lsw.appendChild(subLabelEl('Paste the URLs.'));
  const lss = div('display:flex;flex-direction:column;gap:10px;');
  ['likeSite1','likeSite2','likeSite3','likeSite4','likeSite5'].forEach((k,i) => {
    const sw = div('');
    const si = h('input',{type:'url',style:f[k].style,placeholder:`https:// — website ${i+1}${i>2?' (optional)':''}`,value:f[k].value});
    si.addEventListener('input', f[k].set); sw.appendChild(si);
    if (f[k].hasErr) sw.appendChild(fieldErr(f[k].errMsg));
    lss.appendChild(sw);
  });
  lsw.appendChild(lss);
  if (errs.likeSites) lsw.appendChild(div('font-size:12px;color:#DC2626;margin-top:10px;letter-spacing:-0.1px;', 'Please add at least one website.'));
  frag.appendChild(lsw);

  const lww = div('margin-bottom:24px;');
  lww.appendChild(labelEl('What do you like about them?', false));
  const lwt = h('textarea',{style:f.likeWhat.style,placeholder:'Layout, colors, tone, specific features…'});
  lwt.value = f.likeWhat.value; lwt.addEventListener('input', f.likeWhat.set);
  lww.appendChild(lwt); frag.appendChild(lww);

  const bcw = div('margin-bottom:24px;');
  bcw.appendChild(labelEl('Do you have brand colors?', true));
  const bcr = div('display:flex;gap:18px;');
  radioGroup('brandColors', ['Yes','No'], 'radio').forEach(opt => bcr.appendChild(radioRow(opt, true)));
  bcw.appendChild(bcr);
  if (errs.brandColors) bcw.appendChild(div('font-size:12px;color:#DC2626;margin-top:10px;letter-spacing:-0.1px;', 'Please choose an option.'));
  if (get('brandColors') === 'Yes') {
    const bci = h('input',{type:'text',style:f.brandColorsList.style+'margin-top:10px;',placeholder:'Hex codes or color names — we\'ll confirm against your assets',value:f.brandColorsList.value});
    bci.addEventListener('input', f.brandColorsList.set); bcw.appendChild(bci);
  }
  frag.appendChild(bcw);

  const fw = div('');
  fw.appendChild(labelEl('Do you have preferred fonts?', true));
  const fr = div('display:flex;gap:18px;');
  radioGroup('fonts', ['Yes','No'], 'radio').forEach(opt => fr.appendChild(radioRow(opt, true)));
  fw.appendChild(fr);
  if (errs.fonts) fw.appendChild(div('font-size:12px;color:#DC2626;margin-top:10px;letter-spacing:-0.1px;', 'Please choose an option.'));
  if (get('fonts') === 'Yes') {
    const fi = h('input',{type:'text',style:f.fontsList.style+'margin-top:10px;',placeholder:"Which fonts? We'll confirm licensing and web-readiness at kickoff",value:f.fontsList.value});
    fi.addEventListener('input', f.fontsList.set); fw.appendChild(fi);
  }
  frag.appendChild(fw);
  return frag;
}

// ─── Section 10 ──────────────────────────────────────────────────────────────
function renderS10(f, errs) {
  const frag = document.createDocumentFragment();
  const noLD = !!state.data.noLaunchDate;

  const ldw = div('margin-bottom:24px;');
  ldw.appendChild(labelEl('Is there a desired launch date?', true));
  const ldi = h('input',{type:'date', style:f.launchDate.style+(noLD?'border:1px solid #CBD5E1;background:#F1F5F9;opacity:.6;':''), value:get('launchDate','')});
  if (noLD) ldi.disabled = true;
  ldi.addEventListener('input', f.launchDate.set);
  ldw.appendChild(ldi);
  if (!noLD && errs.launchDate) ldw.appendChild(fieldErr(MSG[errs.launchDate]));
  const nldLabel = label('display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;');
  nldLabel.appendChild(span(boxStyle(noLD,'check'), noLD ? h('i',{className:'ph ph-check',style:'font-size:12px;'}) : null));
  nldLabel.appendChild(span('font-size:14px;letter-spacing:-0.3px;color:#020617;','No desired launch date'));
  nldLabel.addEventListener('click', () => toggleBool('noLaunchDate'));
  ldw.appendChild(nldLabel);
  frag.appendChild(ldw);

  const drw = div('margin-bottom:24px;');
  drw.appendChild(labelEl('Is there an event, campaign, or deadline driving the launch?', false));
  const drt = h('textarea',{style:f.launchDriver.style,placeholder:'e.g. annual gala, giving season, grant deadline.'});
  drt.value = f.launchDriver.value; drt.addEventListener('input', f.launchDriver.set);
  drw.appendChild(drt); frag.appendChild(drw);

  const apw = div('margin-bottom:24px;');
  apw.appendChild(labelEl('Who will provide final approval?', true));
  const approvalSame = !!state.data.approvalSame;
  const asl = label('display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px;');
  asl.appendChild(span(boxStyle(approvalSame,'check'), approvalSame ? h('i',{className:'ph ph-check',style:'font-size:12px;'}) : null));
  asl.appendChild(span('font-size:14px;letter-spacing:-0.3px;color:#020617;','Same as main point of contact'));
  asl.addEventListener('click', () => toggleBool('approvalSame'));
  apw.appendChild(asl);
  if (!approvalSame) {
    const apg = div('display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 18px;border:1px solid #E2E8F0;border-radius:12px;background:#F8FAFC;');
    [['approverName','text','Full name',true,'Name'],['approverRole','text','e.g. Board chair',false,'Role / title'],['approverEmail','email','name@org.org',true,'Email'],['approverPhone','tel','(555) 000-0000',false,'Phone']].forEach(([k,t,ph,req,lbl]) => {
      const fw = div('');
      const lb = h('label',{style:'font-size:13px;color:#475569;margin-bottom:5px;display:block;'},lbl);
      if (req) lb.appendChild(span('color:#DC2626;margin-left:2px;','*'));
      else lb.appendChild(span('color:#94A3B8;font-weight:400;',' (optional)'));
      fw.appendChild(lb);
      const inp = h('input',{type:t,style:f[k].style,placeholder:ph,value:f[k].value});
      inp.addEventListener('input', f[k].set); fw.appendChild(inp);
      if (f[k].hasErr) fw.appendChild(fieldErr(f[k].errMsg));
      apg.appendChild(fw);
    });
    apw.appendChild(apg);
  }
  frag.appendChild(apw);

  const cw = div('');
  cw.appendChild(labelEl('Who should be included in project communications?', false));
  const ct = h('textarea',{style:f.commsPeople.style,placeholder:'Names and emails of anyone who should be kept in the loop.'});
  ct.value = f.commsPeople.value; ct.addEventListener('input', f.commsPeople.set);
  cw.appendChild(ct); frag.appendChild(cw);
  return frag;
}

// ─── Section 11 ──────────────────────────────────────────────────────────────
function renderS11(f) {
  const frag = document.createDocumentFragment();
  const w = div('');
  w.appendChild(labelEl('Is there anything else we should know before planning this project?', false));
  const t = h('textarea',{style:f.anythingElse.style,placeholder:'Anything at all — constraints, context, hopes, worries.'});
  t.value = f.anythingElse.value; t.addEventListener('input', f.anythingElse.set);
  w.appendChild(t); frag.appendChild(w);
  return frag;
}

// ─── Main render ─────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';

  if (state.submitted) {
    root.appendChild(div('padding:96px 0 0;text-align:center;',
      div('width:56px;height:56px;border-radius:9999px;background:#E1F7EA;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;', h('i',{className:'ph ph-check',style:'font-size:28px;color:#339C5E;'})),
      h('h1',{style:'font-family:Karla,sans-serif;font-weight:600;font-size:40px;line-height:48px;letter-spacing:-1.5px;margin:0 0 16px;color:#020617;'},"We've got it, thanks."),
      p('font-size:16px;line-height:24px;color:#475569;max-width:480px;margin:0 auto;',"We'll review your answers internally before your kickoff call. If anything is unclear or we need more detail, we'll follow up by email. Talk soon.")
    ));
    return;
  }

  const step = state.step;
  const tried = !!state.tried[step];
  const errs = tried ? validateStep(step) : {};
  const f = buildFields(errs);

  const STEP_TITLES = ['Organization','Project goals','Audience','Content & assets','Pages & content','Features & functionality','CMS & content management','Technical systems & access','Design direction','Timeline & approvals','Additional information'];

  // header
  root.appendChild(h('header',{style:'margin-bottom:32px;'},
    h('h1',{style:'font-family:Karla,sans-serif;font-weight:600;font-size:40px;line-height:48px;letter-spacing:-1.5px;margin:0 0 12px;color:#020617;'},'Client intake form'),
    p('font-size:16px;line-height:24px;color:#475569;margin:0;','Fill this out before your kickoff call. Your answers help us understand your goals, content, and technical needs — so we can hit the ground running.')
  ));

  // progress
  const prog = div('margin-bottom:28px;');
  const progTop = div('display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;');
  progTop.appendChild(span('font-family:Montserrat,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.02em;text-transform:uppercase;color:#64748B;', `Step ${step} of 11`));
  progTop.appendChild(span('font-family:Karla,sans-serif;font-size:20px;font-weight:600;letter-spacing:-0.6px;color:#020617;', STEP_TITLES[step-1]));
  prog.appendChild(progTop);
  const bar = div('height:6px;border-radius:9999px;background:#F1F5F9;overflow:hidden;');
  const fill = div(`height:100%;background:#077CBF;border-radius:9999px;transition:width 250ms ease-out;width:${Math.round(step/11*100)}%;`);
  bar.appendChild(fill); prog.appendChild(bar);
  root.appendChild(prog);

  // card
  const card = div('background:#fff;border:1px solid #CBD5E1;border-radius:16px;box-shadow:0 1px 3px 0 rgba(0,0,0,.10),0 1px 2px -1px rgba(0,0,0,.10);padding:28px 28px 32px;');

  if (tried && Object.keys(errs).length > 0) {
    card.appendChild(div('display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border:1px solid #FCA5A5;background:#FEF2F2;border-radius:12px;margin-bottom:24px;',
      h('i',{className:'ph ph-warning-circle',style:'font-size:18px;color:#DC2626;margin-top:1px;flex-shrink:0;'}),
      span('font-size:13px;color:#B91C1C;letter-spacing:-0.2px;line-height:1.4;','Please complete the highlighted fields before continuing.')
    ));
  }

  const sections = [null, renderS1, renderS2, renderS3, renderS4, renderS5, renderS6, renderS7, renderS8, renderS9, renderS10, renderS11];
  card.appendChild(sections[step](f, errs, tried));
  root.appendChild(card);

  // nav
  const nav = div('display:flex;align-items:center;justify-content:space-between;margin-top:24px;');
  if (step > 1) {
    const back_btn = h('button', {className:'btn-back', style:'height:39px;padding:0 16px;border-radius:9999px;border:1px solid #CBD5E1;background:#fff;box-shadow:0 1px 2px 0 rgba(0,0,0,.05);font-family:Montserrat,sans-serif;font-weight:600;font-size:14px;letter-spacing:-0.5px;color:#020617;cursor:pointer;display:inline-flex;align-items:center;gap:8px;'},
      h('i',{className:'ph ph-arrow-left',style:'font-size:16px;'}), 'Back');
    back_btn.addEventListener('click', back);
    nav.appendChild(back_btn);
  } else {
    nav.appendChild(span(''));
  }

  if (step < 11) {
    const next_btn = h('button', {className:'btn-next', style:'height:39px;padding:0 20px;border-radius:9999px;border:1px solid transparent;background:#077CBF;font-family:Montserrat,sans-serif;font-weight:600;font-size:14px;letter-spacing:-0.5px;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;'},
      'Continue', h('i',{className:'ph ph-arrow-right',style:'font-size:16px;'}));
    next_btn.addEventListener('click', next);
    nav.appendChild(next_btn);
  } else {
    const isSubmitting = !!state.submitting;
    const sub_btn = h('button', {className:'btn-submit', style:`height:39px;padding:0 24px;border-radius:9999px;border:1px solid transparent;background:${isSubmitting?'#5ba3c9':'#077CBF'};font-family:Montserrat,sans-serif;font-weight:600;font-size:14px;letter-spacing:-0.5px;color:#fff;cursor:${isSubmitting?'not-allowed':'pointer'};display:inline-flex;align-items:center;gap:8px;`},
      isSubmitting ? 'Submitting…' : 'Submit',
      isSubmitting ? null : h('i',{className:'ph ph-check',style:'font-size:16px;'}));
    if (!isSubmitting) sub_btn.addEventListener('click', submit);
    nav.appendChild(sub_btn);
  }
  root.appendChild(nav);
}

render();
</script>
</body>
</html>
